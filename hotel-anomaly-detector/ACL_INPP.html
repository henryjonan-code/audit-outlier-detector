<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuditScope INPP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: radial-gradient(1200px 600px at 10% -10%, rgba(37, 99, 235, 0.2), transparent 55%),
          radial-gradient(900px 500px at 90% 10%, rgba(244, 63, 94, 0.18), transparent 50%),
          linear-gradient(180deg, #0b1220 0%, #0a0f1c 100%);
        background-attachment: fixed;
      }
      h1,
      h2,
      h3,
      h4,
      .title-font {
        font-family: "Space Grotesk", sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      .animate-in-custom {
        animation: slideUp 0.4s ease-out forwards;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .custom-chart-container .recharts-cartesian-axis-tick-value {
        fill: #94a3b8;
        font-size: 11px;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useMemo, useEffect } = React;

      // --- AMBIL KOMPONEN RECHARTS DENGAN PROTEKSI ---
      const getRechartsComponent = (name) => {
        if (window.Recharts && window.Recharts[name]) return window.Recharts[name];
        return () => null;
      };
      const BarChart = getRechartsComponent("BarChart");
      const Bar = getRechartsComponent("Bar");
      const XAxis = getRechartsComponent("XAxis");
      const YAxis = getRechartsComponent("YAxis");
      const Tooltip = getRechartsComponent("Tooltip");
      const ResponsiveContainer = getRechartsComponent("ResponsiveContainer");
      const Cell = getRechartsComponent("Cell");

      // --- IKON LUCIDE ---
      const Icon = ({ name, size = 24, className = "" }) => {
        useEffect(() => {
          if (window.lucide) window.lucide.createIcons();
        }, [name]);
        return (
          <i
            data-lucide={name}
            className={className}
            style={{ width: size, height: size }}
          ></i>
        );
      };

      // --- FUNGSI PEMBANTU (HELPERS) ---
      const detectCsvDelimiter = (text) => {
        const sample = String(text || "")
          .split(/\r?\n/)
          .slice(0, 8)
          .join("\n");
        const candidates = [",", ";", "\t", "|"];
        let best = ",";
        let bestScore = -1;
        candidates.forEach((delim) => {
          const score = sample
            .split("\n")
            .map((line) => line.split(delim).length - 1)
            .reduce((sum, n) => sum + (n > 0 ? n : 0), 0);
          if (score > bestScore) {
            bestScore = score;
            best = delim;
          }
        });
        return best;
      };
      const normHeaderKey = (v) =>
        safeStr(v)
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "");
      const detectLikelyHeaderRow = (matrixRows) => {
        if (!Array.isArray(matrixRows) || matrixRows.length === 0) return 0;
        const scanRows = matrixRows.slice(0, 30);
        let bestIdx = 0;
        let bestScore = -Infinity;
        scanRows.forEach((row, idx) => {
          if (!Array.isArray(row)) return;
          const cells = row.map((cell) => safeStr(cell));
          const filled = cells.filter(Boolean);
          if (filled.length < 2) return;
          let textLike = 0;
          let numericLike = 0;
          filled.forEach((cell) => {
            const alpha = cell.replace(/[^A-Za-z]/g, "");
            if (alpha.length >= 2) textLike += 1;
            if (/^[0-9.,\-()]+$/.test(cell)) numericLike += 1;
          });
          const uniq = new Set(filled.map((c) => normHeaderKey(c))).size;
          const score = filled.length * 3 + textLike * 2 + uniq - numericLike * 2;
          if (score > bestScore) {
            bestScore = score;
            bestIdx = idx;
          }
        });
        return bestScore === -Infinity ? 0 : bestIdx;
      };
      const tableRowsToObjects = (matrixRows) => {
        if (!Array.isArray(matrixRows) || matrixRows.length === 0) return [];
        const nonEmptyRows = matrixRows.filter(
          (row) => Array.isArray(row) && row.some((cell) => safeStr(cell))
        );
        if (!nonEmptyRows.length) return [];
        const headerRowIndex = detectLikelyHeaderRow(nonEmptyRows);
        const rawHeaders = nonEmptyRows[headerRowIndex] || [];
        const seen = {};
        const headers = rawHeaders.map((h, i) => {
          const clean = safeStr(h) || `COL_${i + 1}`;
          const key = normHeaderKey(clean) || `col${i + 1}`;
          seen[key] = (seen[key] || 0) + 1;
          return seen[key] > 1 ? `${clean}_${seen[key]}` : clean;
        });
        const data = [];
        for (let r = headerRowIndex + 1; r < nonEmptyRows.length; r++) {
          const row = nonEmptyRows[r];
          if (!row || row.every((cell) => !safeStr(cell))) continue;
          const obj = {};
          headers.forEach((h, i) => {
            obj[h] = row[i] ?? "";
          });
          const nonEmptyValues = Object.values(obj).filter((v) => safeStr(v)).length;
          if (nonEmptyValues <= 0) continue;
          data.push(obj);
        }
        return data;
      };
      const parseCSV = (text) => {
        if (!window.Papa) {
          alert(
            "Kesalahan: Pustaka PapaParse gagal dimuat. Harap periksa koneksi internet Anda."
          );
          return [];
        }
        const cleaned = String(text || "").replace(/^\uFEFF/, "");
        if (!cleaned.trim()) return [];
        const delimiter = detectCsvDelimiter(cleaned);
        const matrixRes = Papa.parse(cleaned, {
          header: false,
          skipEmptyLines: "greedy",
          dynamicTyping: false,
          delimiter,
        });
        const matrixRows = matrixRes.data || [];
        const smart = tableRowsToObjects(matrixRows);
        if (smart.length) return smart;
        const fallback = Papa.parse(cleaned, {
          header: true,
          skipEmptyLines: "greedy",
          dynamicTyping: false,
          delimiter,
        });
        return fallback.data || [];
      };

      const parseXLSX = (arrayBuffer) => {
        if (!window.XLSX) {
          alert("Kesalahan: Pustaka XLSX gagal dimuat. Harap periksa koneksi internet Anda.");
          return [];
        }
        const matrixToObjectsFallback = (matrixRows) => {
          const nonEmptyRows = (matrixRows || []).filter(
            (row) => Array.isArray(row) && row.some((cell) => safeStr(cell))
          );
          if (!nonEmptyRows.length) return [];
          const maxCols = Math.max(...nonEmptyRows.map((row) => row.length), 0);
          if (!maxCols) return [];
          const headers = Array.from({ length: maxCols }, (_, i) => `COL_${i + 1}`);
          return nonEmptyRows
            .map((row) => {
              const obj = {};
              headers.forEach((h, idx) => {
                obj[h] = row[idx] ?? "";
              });
              return obj;
            })
            .filter((obj) => Object.values(obj).some((v) => safeStr(v)));
        };
        const looksLikeDataUsedAsHeader = (headers) => {
          const hs = (headers || []).map((h) => safeStr(h)).filter(Boolean);
          if (!hs.length) return true;
          const alphaRich = hs.filter((h) => /[A-Za-z]{3,}/.test(h)).length;
          const numericLike = hs.filter((h) => /^[0-9.,\-()/\s]+$/.test(h)).length;
          const datetimeLike = hs.filter((h) =>
            /(\d{4}[-/]\d{1,2}[-/]\d{1,2}|gmt|am|pm|00:00:00)/i.test(h)
          ).length;
          const veryLong = hs.filter((h) => h.length > 45).length;
          const codedLike = hs.filter((h) => /[A-Za-z]{1,4}-\d{3,}/.test(h)).length;
          const dataSignals = numericLike + datetimeLike + veryLong + codedLike;
          return alphaRich < Math.max(2, Math.ceil(hs.length * 0.25)) || dataSignals > hs.length * 0.45;
        };

        const workbook = XLSX.read(arrayBuffer, { type: "array" });
        const sheetNames = workbook.SheetNames || [];
        if (sheetNames.length === 0) return [];
        let bestData = [];
        let bestScore = -1;
        for (const name of sheetNames) {
          const sheet = workbook.Sheets[name];
          if (!sheet) continue;
          const matrixRows = XLSX.utils.sheet_to_json(sheet, {
            header: 1,
            defval: "",
            raw: false,
          });
          let data = tableRowsToObjects(matrixRows);
          if (data.length && looksLikeDataUsedAsHeader(Object.keys(data[0] || {}))) {
            const positional = matrixToObjectsFallback(matrixRows);
            if (positional.length) data = positional;
          }
          if (!data.length) {
            data = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });
          }
          if (!data.length) {
            data = matrixToObjectsFallback(matrixRows);
          }
          const colCount = data.length ? Object.keys(data[0]).length : 0;
          const score = data.length * Math.max(1, Math.min(colCount, 20));
          if (score > bestScore) {
            bestScore = score;
            bestData = data;
          }
        }
        return bestData;
      };
      const parseXLSXARListing = (arrayBuffer) => {
        if (!window.XLSX) {
          alert("Kesalahan: Pustaka XLSX gagal dimuat. Harap periksa koneksi internet Anda.");
          return [];
        }
        const wb = XLSX.read(arrayBuffer, { type: "array" });
        const sheetNames = wb.SheetNames || [];
        if (!sheetNames.length) return [];
        const codeRegex = /^\d{3,5}\.[a-z0-9]+$/i;
        const out = [];
        const dedupe = {};
        const netAmount = (debitRaw, creditRaw) => toNum(debitRaw) - toNum(creditRaw);

        sheetNames.forEach((sheetName) => {
          const sheet = wb.Sheets[sheetName];
          if (!sheet) return;
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });
          if (!rows.length) return;
          const previewText = rows
            .slice(0, 80)
            .flat()
            .map((v) => safeStr(v))
            .join(" ")
            .toLowerCase();
          const roughSignal =
            previewText.includes("rough account listing") &&
            previewText.includes("beginning balance") &&
            previewText.includes("ending balance");
          if (!roughSignal) return;

          let pending = null;
          rows.forEach((row, idx) => {
            const accountCode = safeStr(row?.[1]).replace(/\s+/g, "").toUpperCase();
            const accountName = safeStr(row?.[4]).replace(/\s+/g, " ").trim();
            const marker = safeStr(row?.[11]).toUpperCase();
            const debitRaw = row?.[18] ?? "";
            const creditRaw = row?.[19] ?? "";

            if (codeRegex.test(accountCode) && /BEGINNING\s*BALANCE/.test(marker)) {
              const unitMatch = accountName.match(/AR\s*Unit\s*([0-9A-Z]+)/i);
              const categoryMatch = accountName.match(/A\/R\s*Other\s*\(([^)]+)\)/i);
              pending = {
                ar_source: "rough_account_listing",
                source_sheet: sheetName,
                source_row: idx + 1,
                account_code: accountCode,
                account_name: accountName,
                unit: unitMatch ? safeStr(unitMatch[1]).toUpperCase() : "",
                category: categoryMatch ? safeStr(categoryMatch[1]) : "",
                beginning_balance: netAmount(debitRaw, creditRaw),
                total_debit: 0,
                total_credit: 0,
                ending_balance: 0,
              };
              return;
            }
            if (!pending) return;
            if (/TOTAL\s*AMOUNT/.test(marker)) {
              pending.total_debit = toNum(debitRaw);
              pending.total_credit = toNum(creditRaw);
              return;
            }
            if (/ENDING\s*BALANCE/.test(marker)) {
              pending.ending_balance = netAmount(debitRaw, creditRaw);
              const key = [
                safeStr(pending.account_code).toUpperCase(),
                safeStr(pending.account_name).toUpperCase(),
                safeStr(pending.unit).toUpperCase(),
                safeStr(pending.beginning_balance),
                safeStr(pending.total_debit),
                safeStr(pending.total_credit),
                safeStr(pending.ending_balance),
              ].join("|");
              if (!dedupe[key]) {
                dedupe[key] = true;
                out.push({ ...pending });
              }
              pending = null;
            }
          });
        });
        return out;
      };
      const parseXLSXSummaryAP = (arrayBuffer) => {
        if (!window.XLSX) {
          alert("Kesalahan: Pustaka XLSX gagal dimuat. Harap periksa koneksi internet Anda.");
          return [];
        }
        const wb = XLSX.read(arrayBuffer, { type: "array" });
        const sheetNames = wb.SheetNames || [];
        if (!sheetNames.length) return [];
        const keyOf = (v) =>
          safeStr(v)
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "");
        const findSheet = (candidates, opts = {}) =>
          sheetNames.find((name) => {
            const k = keyOf(name);
            const match = candidates.some((c) => k.includes(c));
            if (!match) return false;
            if (opts.excludeSummary && k.includes("summary")) return false;
            return true;
          }) || "";
        const summarySheetName = findSheet([
          "summaryaccountpayabletrade",
          "summaryap",
          "summaryaccountpayable",
        ]);
        const detailSheetName = findSheet([
          "accountpayabletrade",
          "accountpayable",
        ], { excludeSummary: true });
        const otherPayableSheetName = findSheet([
          "summaryotherpayable",
          "summaryotherspayable",
        ]);
        const accruedSheetName = findSheet([
          "summaryaccruedexpenses",
          "summaryaccruedexpense",
          "summaryaccrued",
        ]);
        const advSheetName = findSheet([
          "summaryadvpayment",
          "summaryadvancepayment",
          "summaryagingadvancepayment",
        ]);
        const deferredSheetName = findSheet([
          "summarydefferedincome",
          "summarydeferredincome",
          "summarydeffered",
          "summarydeferred",
        ]);
        const out = [];
        const codeRegex = /^\d{3,5}\.[a-z0-9]+$/i;
        const readRows = (sheetName) =>
          sheetName && wb.Sheets[sheetName]
            ? XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {
                header: 1,
                defval: "",
                raw: false,
              })
            : [];
        const parseAgingSummary = (sheetName, rowType, nameField = "vendor") => {
          const rows = readRows(sheetName);
          rows.forEach((row, idx) => {
            const code = safeStr(row?.[1]).replace(/\s+/g, "").toUpperCase();
            const name = safeStr(row?.[2]).replace(/\s+/g, " ").trim();
            if (!codeRegex.test(code) || !name) return;
            const payload = {
              row_type: rowType,
              source_sheet: sheetName,
              source_row: idx + 1,
              coa: code,
              amount: row?.[3] ?? "",
              current: row?.[4] ?? "",
              od_1_30: row?.[5] ?? "",
              od_31_60: row?.[6] ?? "",
              od_gt61: row?.[7] ?? "",
            };
            payload[nameField] = name;
            if (nameField !== "vendor") payload.vendor = name;
            out.push(payload);
          });
        };
        parseAgingSummary(summarySheetName, "ap_summary", "vendor");
        parseAgingSummary(otherPayableSheetName, "other_payable_summary", "name");
        parseAgingSummary(accruedSheetName, "accrued_summary", "name");
        if (detailSheetName && wb.Sheets[detailSheetName]) {
          const rows = readRows(detailSheetName);
          let currentCode = "";
          let currentVendor = "";
          rows.forEach((row, idx) => {
            const code = safeStr(row?.[1]).replace(/\s+/g, "").toUpperCase();
            const vendor = safeStr(row?.[2]).replace(/\s+/g, " ").trim();
            const marker = safeStr(row?.[3]).toUpperCase();
            if (codeRegex.test(code) && vendor && !marker) {
              currentCode = code;
              currentVendor = vendor;
            }
            if (marker === "TOTAL" && currentCode && currentVendor) {
              out.push({
                row_type: "ap_detail_total",
                source_sheet: detailSheetName,
                source_row: idx + 1,
                coa: currentCode,
                vendor: currentVendor,
                detail_total: row?.[5] ?? "",
                detail_saldo: row?.[8] ?? "",
                detail_aging_total: row?.[17] ?? "",
                amount: row?.[5] ?? "",
              });
            }
          });
        }
        if (advSheetName && wb.Sheets[advSheetName]) {
          const rows = readRows(advSheetName);
          rows.forEach((row, idx) => {
            const unit = safeStr(row?.[1]).replace(/\s+/g, " ").trim();
            const name = safeStr(row?.[2]).replace(/\s+/g, " ").trim();
            if (!unit || !name) return;
            const unitUpper = unit.toUpperCase();
            if (unitUpper === "UNIT" || unitUpper.includes("***")) return;
            if (name.toUpperCase() === "NAMA") return;
            const amount = row?.[3] ?? "";
            const numericSignal = toNum(amount);
            if (numericSignal === 0 && !/(UNK|UNKNOWN)/i.test(`${unit} ${name}`)) return;
            out.push({
              row_type: "adv_payment_summary",
              source_sheet: advSheetName,
              source_row: idx + 1,
              unit,
              name,
              amount,
            });
          });
        }
        if (deferredSheetName && wb.Sheets[deferredSheetName]) {
          const rows = readRows(deferredSheetName);
          rows.forEach((row, idx) => {
            const unit = safeStr(row?.[1]).replace(/\s+/g, " ").trim();
            const name = safeStr(row?.[2]).replace(/\s+/g, " ").trim();
            if (!unit || !name) return;
            const unitUpper = unit.toUpperCase();
            if (unitUpper === "UNIT" || unitUpper.includes("***")) return;
            if (name.toUpperCase() === "NAMA") return;
            const total = row?.[3] ?? "";
            const amount = row?.[4] ?? "";
            if (toNum(amount) === 0 && toNum(total) === 0) return;
            out.push({
              row_type: "deferred_income_summary",
              source_sheet: deferredSheetName,
              source_row: idx + 1,
              unit,
              name,
              total,
              amount,
            });
          });
        }
        return out;
      };
      const toNum = (val) => {
        if (val === null || val === undefined || val === "") return 0;
        // JS number → return as-is (no string heuristics on native floats)
        if (typeof val === "number") return isNaN(val) ? 0 : val;
        let raw = val.toString().trim();
        if (!raw) return 0;
        // Handle scientific notation like "1e6" → strip 'e' → would produce "16"; parse properly
        if (/^-?[\d.]+e[+-]?\d+$/i.test(raw)) {
          const parsed = Number(raw);
          return isNaN(parsed) ? 0 : parsed;
        }
        // Accounting negative notation: (1,234.56) → -1234.56
        let accountingNeg = false;
        if (raw.startsWith("(") && raw.endsWith(")")) {
          accountingNeg = true;
          raw = raw.slice(1, -1).trim();
        }
        const hasDot = raw.includes(".");
        const hasComma = raw.includes(",");
        const dotCount = (raw.match(/\./g) || []).length;
        const commaCount = (raw.match(/,/g) || []).length;
        let normalized = raw;
        if (hasDot && hasComma) {
          const lastDot = raw.lastIndexOf(".");
          const lastComma = raw.lastIndexOf(",");
          if (lastComma > lastDot) {
            // European format: 1.234,56 → comma is decimal separator
            normalized = raw.replace(/\./g, "").replace(/,/g, ".");
          } else {
            // US format: 1,234.56 → comma is thousands separator
            normalized = raw.replace(/,/g, "");
          }
        } else if (hasComma && !hasDot) {
          if (commaCount > 1) {
            // Multiple commas → all thousands: 4,200,000,000
            normalized = raw.replace(/,/g, "");
          } else {
            const afterComma = (raw.split(",")[1] || "");
            // Exactly 3 digits after single comma = thousands: 1,234
            normalized = /^\d{3}$/.test(afterComma)
              ? raw.replace(/,/g, "")
              : raw.replace(/,/g, ".");
          }
        } else if (hasDot && !hasComma) {
          if (dotCount > 1) {
            // Multiple dots → all thousands: 1.234.567
            normalized = raw.replace(/\./g, "");
          } else {
            // Single dot: 3-digit decimal part = Indonesian thousands separator
            // Rules: integer part "0" → always decimal (0.123 = 0.123, 0.500 = 0.5)
            // Integer part ≥ "1" AND exactly 3 decimal digits → thousands (12.500 → 12500)
            const dotParts = normalized.split(".");
            const intPart = dotParts[0].replace(/^-/, "");
            if (dotParts[1] && /^\d{3}$/.test(dotParts[1]) && intPart !== "0" && intPart !== "")
              normalized = dotParts[0] + dotParts[1];
            // else: treat dot as decimal separator (0.123, 12.5, 0.75 etc.)
          }
        }
        const num = parseFloat(normalized.replace(/[^0-9.-]+/g, ""));
        if (isNaN(num)) return 0;
        return accountingNeg ? -Math.abs(num) : num;
      };
      const ID_MONTH_MAP = {
        januari:0, februari:1, maret:2, april:3, mei:4, juni:5,
        juli:6, agustus:7, september:8, oktober:9, november:10, desember:11,
        jan:0, feb:1, mar:2, apr:3, jun:5, jul:6, agu:7, agt:7, sep:8, okt:9, nov:10, des:11,
        january:0, february:1, march:2, may:4, june:5, july:6, august:7,
        october:9, december:11,
      };
      const toDate = (val) => {
        if (val === null || val === undefined || val === "") return null;
        if (typeof val === "number" && isFinite(val)) {
          if (val > 20000 && val < 80000) {
            return new Date(Date.UTC(1899, 11, 30) + Math.round(val) * 86400000);
          }
          const dNum = new Date(val);
          return isNaN(dNum.getTime()) ? null : dNum;
        }
        if (val instanceof Date) return val;
        const s = String(val).trim();
        const validateDate = (y, mo, dd) => {
          const r = new Date(y, mo, dd);
          return (r.getFullYear() === y && r.getMonth() === mo && r.getDate() === dd) ? r : null;
        };
        // Indonesian/English long format: "7 Agustus 2026" / "7 August 2026"
        // Also strips trailing time if present: "7 Agustus 2026 14:30"
        const longM = s.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
        if (longM) {
          const month = ID_MONTH_MAP[longM[2].toLowerCase()];
          if (month !== undefined) {
            const r = validateDate(parseInt(longM[3]), month, parseInt(longM[1]));
            if (r) return r;
            return null; // invalid like "31 Februari 2026"
          }
        }
        // DD/MM/YYYY [HH:MM[:SS]] — Indonesian standard, optional time suffix

          return {

            if (!line.startsWith("-")) return;
            const match = line.match(
              /-\s+(.+?)::(.+?)\s+=\s+(\d+)\s+::\s+(.*)$/
            );
            if (!match) return;
            const [, module, test, count, refs] = match;
            const key = `${module.trim()}||${test.trim()}`;
            expected[key] = parseInt(count, 10) || 0;
            const refList = refs
              .split(",")
              .map((r) => r.trim())

          const expectedKeys = new Set(Object.keys(expected));
          const actualKeys = new Set(Object.keys(actual));

          const extra = [];
          const mismatched = [];
          const refDiff = [];

          expectedKeys.forEach((key) => {
            if (!actualKeys.has(key)) {
              const [module, test] = key.split("||");
              missing.push({ module, test, expected: expected[key] });
            }
          });

            if (!expectedKeys.has(key)) {
              const [module, test] = key.split("||");

            if (exp !== act) {

            }
            const expRefs = new Set(expectedRefs[key] || []);

            const missRefs = [...expRefs].filter((r) => !actRefs.has(r));

                .then((txt) => resolve(txt))
                .catch(() => {
                  const reader = new FileReader();
                  reader.onload = () => resolve(reader.result || "");
                  reader.onerror = () =>
                    reject(reader.error || new Error("Gagal membaca file text."));
                  reader.readAsText(file);
                });
              return;
            }
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result || "");

        const handleAutoUpload = async (e) => {

          try {

                let parsed = [];

                  parsed = parseCSV(await readFileTextCompat(file));

          // BANK/AP: duplicate payment across different dates + reversal check
          const normalizeCounterparty = (txt) => {

          };
          const crossDateDuplicateMap = {};

          // BANK: payroll monthly completeness and split pattern

          // BANK: PPh monthly completeness and delayed settlement

          bankRowsWithDate.forEach((b) => {

          const dominantYear = Number(

          );
          if (dominantYear && pphRowsOut.length) {

            const pphMonths = new Set(

          const bankPayComparable = hasRangeOverlap(bankRowsOut, payRowsOut, 0);

          const bankFlowIndex = buildAmountIndex(bankRowsOut, (b) => b.flow.amount);

            bankRowsOut.forEach((b) => {

            payRowsOut.forEach((p) => {

                    right: null,

            bankRowsOut.forEach((b) => {

                  ref: safeStr(inv.id || "INV-UNMATCH"),
                });
              }
            });
          }

          if (bankRowsOut.length && stmtRowsOut.length && bankStmtComparable) {
            const matchedBank = new Set();
            const matchedStmt = new Set();
            const seenTxnId = new Set();
            bankRowsOut.forEach((b) => {

              if (txId && seenTxnId.has(txId)) {

                  test: "Duplicate Transaction",

              if (txId) seenTxnId.add(txId);

                  id: genId("RECON"),

            const unmatchedStmt = [];

            stmtRowsOut.forEach((s) => {

              if (match) {

            const stmtMatchRatio = matchedStmt.size / Math.max(1, stmtRowsOut.length);
            const lowComparability =
              stmtMatchRatio < 0.08 &&

            if (!lowComparability) {

                  ref: safeStr(s.id || s.desc || "STMT-UNMATCH"),

          } else if (bankRowsOut.length && stmtRows.length) {

          // 5. AI OUTLIERS (AUTO)

          addOutliers({

          // ============================================================
          // RATE CHANGE ANOMALY — 5 KATEGORI
          // ============================================================
          const rcParseAmt = (v) => {
            const s = safeStr(v).replace(/,/g, "").replace(/'/g, "").trim();
            const n = parseFloat(s);
            return isNaN(n) ? null : n;
          };
          const rcIsAfterHours = (timeVal) => {
            const s = safeStr(timeVal);
            if (!s) return false;
            const parts = s.split(":");
            const h = parseInt(parts[0], 10);
            return !isNaN(h) && (h >= 22 || h < 6);
          };
          const rcGetField = (row, ...candidates) => {
            for (const k of candidates) {
              const found = Object.keys(row).find(
                (rk) => normalizeKey(rk) === normalizeKey(k)
              );
              if (found && safeStr(row[found]) !== "") return row[found];
            }
            return "";
          };

          if (rateChange.length > 0) {
            // Seen sets for dedup
            const rcSeen1 = new Set(), rcSeen2 = new Set(), rcSeen3 = new Set(), rcSeen4 = new Set();
            const rcResvDay = {};

            rateChange.forEach((row) => {
              const resv = safeStr(rcGetField(row, "Reservation No", "ReservationNo", "resv", "reservation"));
              const roomNo = safeStr(rcGetField(row, "Room No", "RoomNo", "room_no", "room"));
              const guest = safeStr(rcGetField(row, "Guest Name", "GuestName", "guest"));
              const status = safeStr(rcGetField(row, "Status", "Reserv Status", "ReservStatus"));
              const r1Raw = rcGetField(row, "Room Rate1", "RoomRate1", "Rate Baru", "RateBaru", "NewRate", "new_rate");
              const r2Raw = rcGetField(row, "Room Rate2", "RoomRate2", "Rate Lama", "RateLama", "OldRate", "old_rate");
              const varRaw = rcGetField(row, "Variance", "Selisih", "variance");
              const staffId = safeStr(rcGetField(row, "ID", "StaffID", "Staff ID", "User", "ChangedBy", "id"));
              const chgDate = safeStr(rcGetField(row, "Change Date", "ChangeDate", "TglUbah", "Date"));
              const chgTime = safeStr(rcGetField(row, "Time", "Change Time", "ChangeTime", "Jam"));

              const r1 = rcParseAmt(r1Raw);
              const r2 = rcParseAmt(r2Raw);
              let variance = rcParseAmt(varRaw);
              if (variance === null && r1 !== null && r2 !== null) variance = r1 - r2;

              // S1: Rate turun >30%
              if (r1 !== null && r2 !== null && r2 > 0 && variance !== null && variance < 0) {
                const pct = (Math.abs(variance) / r2) * 100;
                if (pct >= 30) {
                  const key1 = `${resv}|${r1}|${r2}`;
                  if (!rcSeen1.has(key1)) {
                    rcSeen1.add(key1);
                    const afterHours = rcIsAfterHours(chgTime);
                    const score = (pct >= 50 || afterHours) ? 95 : 80;
                    exc.push({
                      id: genId("RC"),
                      module: "FO_RC",
                      test: "RC Rate Turun >30%",
                      score,
                      desc: `Resv ${resv} Kamar ${roomNo}: Rate ${Math.round(r2).toLocaleString()} → ${Math.round(r1).toLocaleString()} (turun ${pct.toFixed(1)}%)${afterHours ? " — DINI HARI!" : ""}`,
                      ref: resv || roomNo,
                    });
                  }
                }
              }

              // S2: Rate hampir nol
              if (r1 !== null && r2 !== null && r1 < 10000 && r2 > 50000) {
                const key2 = `${resv}|${r1}|${r2}`;
                if (!rcSeen2.has(key2)) {
                  rcSeen2.add(key2);
                  exc.push({
                    id: genId("RC"),
                    module: "FO_RC",
                    test: "RC Rate Hampir Nol",
                    score: 97,
                    desc: `Resv ${resv} Kamar ${roomNo}: Rate diturunkan ke Rp ${Math.round(r1).toLocaleString()} dari Rp ${Math.round(r2).toLocaleString()}`,
                    ref: resv || roomNo,
                  });
                }
              }

              // S3: Dini hari (22:00–06:00)
              if (rcIsAfterHours(chgTime) && variance !== null && variance !== 0) {
                const key3 = `${resv}|${r1}|${r2}|${chgTime}`;
                if (!rcSeen3.has(key3)) {
                  rcSeen3.add(key3);
                  const score = variance < 0 ? 92 : 75;
                  exc.push({
                    id: genId("RC"),
                    module: "FO_RC",
                    test: "RC Perubahan Dini Hari",
                    score,
                    desc: `Resv ${resv} Kamar ${roomNo}: Rate diubah pukul ${chgTime} (${variance < 0 ? "TURUN" : "NAIK"} ${Math.abs(variance || 0).toLocaleString()})`,
                    ref: resv || roomNo,
                  });
                }
              }

              // S4: Tanpa Staff ID
              const noStaff = !staffId || ["none", "?", "nan", "null", ""].includes(staffId.toLowerCase());
              if (noStaff && variance !== null && variance !== 0) {
                const key4 = `${resv}|${r1}|${r2}`;
                if (!rcSeen4.has(key4)) {
                  rcSeen4.add(key4);
                  exc.push({
                    id: genId("RC"),
                    module: "FO_RC",
                    test: "RC Tanpa Staff ID",
                    score: 80,
                    desc: `Resv ${resv} Kamar ${roomNo}: Rate berubah tanpa Staff ID (Δ ${(variance || 0) < 0 ? "-" : "+"}${Math.abs(variance || 0).toLocaleString()})`,
                    ref: resv || roomNo,
                  });
                }
              }

              // S5: Multiple changes per resv per day (group)
              if (resv && chgDate) {
                const key5 = `${resv}|${chgDate}`;
                if (!rcResvDay[key5]) rcResvDay[key5] = [];
                const dupKey = `${r1}|${r2}`;
                if (!rcResvDay[key5].includes(dupKey)) rcResvDay[key5].push(dupKey);
              }
            });

            // S5: emit multi-change exceptions
            Object.entries(rcResvDay).forEach(([key, changes]) => {
              if (changes.length <= 1) return;
              const [resv, chgDate] = key.split("|");
              const score = changes.length >= 5 ? 95 : 82;
              exc.push({
                id: genId("RC"),
                module: "FO_RC",
                test: "RC Multi Perubahan",
                score,
                desc: `Resv ${resv} tanggal ${chgDate}: ${changes.length}x perubahan rate dalam 1 hari`,
                ref: resv,
              });
            });
          }

          // ============================================================
          // FO TRANSACTION ANOMALY — 4 KATEGORI
          // ============================================================
          const CARD_METHODS_FO = new Set([
            "visa", "master", "bni master", "bni visa", "bca card", "bca amex",
            "debit card", "debit bni", "bca unionpay", "bca union pay", "bca jcb",
            "bni jcb card", "bni amex", "bca debit", "bni debit", "bca master",
            "bca visa", "payment link bca",
          ]);
          const isCardMethod = (s) => {
            const lower = safeStr(s).toLowerCase().replace(/\[.*?\]/g, "").trim();
            for (const cm of CARD_METHODS_FO) {
              if (lower.includes(cm)) return true;
            }
            return false;
          };
          const isCashMethod = (s) => safeStr(s).toLowerCase().includes("cash");

          const foGetField = (row, ...candidates) => {
            for (const k of candidates) {
              const found = Object.keys(row).find(
                (rk) => normalizeKey(rk) === normalizeKey(k)
              );
              if (found && safeStr(row[found]) !== "") return row[found];
            }
            return "";
          };

          const foNormalizeRows = (rows) => rows.map((row) => {
            const billNo = toNum(foGetField(row, "Bill Number", "BillNumber", "bill_number", "Bill No"));
            const artNo = toNum(foGetField(row, "Article Number", "ArticleNumber", "article_no", "Article"));
            const descRaw = safeStr(foGetField(row, "Description", "Desc", "description"));
            const roomNo = safeStr(foGetField(row, "Room Number", "RoomNumber", "room_no", "Room"));
            const resv = toNum(foGetField(row, "Reservation Number", "ReservationNumber", "resv_no", "Reservation"));
            const payBy = safeStr(foGetField(row, "Payment By", "PaymentBy", "Cek", "Method", "payment_method"));
            const cekClean = payBy.replace(/\[.*?\]/g, "").trim();
            const amount = toNum(foGetField(row, "Amount", "amount"));
            const billReceiver = safeStr(foGetField(row, "Bill Receiver", "BillReceiver"));
            const guestName = safeStr(foGetField(row, "Guest Name", "GuestName", "Guest"));
            return { billNo, artNo, descRaw, roomNo, resv, cekClean, amount, billReceiver, guestName };
          }).filter((r) => r.billNo > 0);

          if (foPayment.length > 0 || foRevenue.length > 0) {
            const payRows = foNormalizeRows(foPayment);
            const revRows = foNormalizeRows(foRevenue);

            // Payment range: Article 1-49
            const payRange = payRows.filter((r) => r.artNo >= 1 && r.artNo <= 49);
            const payReal = payRange.filter((r) => !r.descRaw.startsWith("*"));

            // Room charge rows: Article 99
            const rcRows = revRows.filter((r) => r.artNo === 99 && !r.descRaw.startsWith("*"));

            // Build net payment methods per bill
            const billMethods = {};
            payReal.forEach((r) => {
              if (!billMethods[r.billNo]) billMethods[r.billNo] = {};
              if (!billMethods[r.billNo][r.cekClean]) billMethods[r.billNo][r.cekClean] = 0;
              billMethods[r.billNo][r.cekClean] += r.amount;
            });
            // Remove zero-net methods
            Object.keys(billMethods).forEach((b) => {
              Object.keys(billMethods[b]).forEach((m) => {
                if (billMethods[b][m] === 0) delete billMethods[b][m];
              });
            });

            // Build bill → rooms and bill → reservations maps
            const billToRooms = {};
            const billToResvs = {};
            [...payRows, ...revRows].forEach((r) => {
              if (!billToRooms[r.billNo]) billToRooms[r.billNo] = new Set();
              if (!billToResvs[r.billNo]) billToResvs[r.billNo] = new Set();
              if (r.roomNo && !["", "nan", "*"].includes(r.roomNo)) billToRooms[r.billNo].add(r.roomNo);
              if (r.resv && !isNaN(r.resv) && r.resv > 0) billToResvs[r.billNo].add(r.resv);
            });

            // FO-1: Split Payment (one bill, multiple rooms/reservations, Cash + other method)
            Object.entries(billMethods).forEach(([billStr, methods]) => {
              const bill = Number(billStr);
              const methodKeys = Object.keys(methods);
              if (methodKeys.length <= 1) return;
              const hasCash = methodKeys.some((m) => isCashMethod(m));
              if (!hasCash) return;
              const rooms = billToRooms[bill] || new Set();
              const resvs = billToResvs[bill] || new Set();
              if (rooms.size <= 1 && resvs.size <= 1) return;
              const methodStr = methodKeys.map((m) => `${m} (${Math.round(methods[m]).toLocaleString()})`).join("; ");
              const score = (rooms.size > 1 && resvs.size > 1) ? 95 : 82;
              exc.push({
                id: genId("FO"),
                module: "FO_TX",
                test: "FO Split Payment",
                score,
                desc: `Bill ${bill}: ${methodStr} | ${rooms.size} kamar, ${resvs.size} reservasi`,
                ref: String(bill),
              });
            });

            // Extract bill transfer edges from "*" pattern
            const starPattern = /^\*(\d+)/;
            const foEdges = [];
            payRange.forEach((r) => {
              const m = starPattern.exec(r.descRaw);
              if (m) foEdges.push([Number(m[1]), r.billNo]);
            });
            revRows.forEach((r) => {
              const m = starPattern.exec(r.descRaw);
              if (m) foEdges.push([Number(m[1]), r.billNo]);
            });

            // Union-Find for bill chains
            if (foEdges.length > 0) {
              const parent = {};
              const ufFind = (x) => {
                if (!parent[x]) parent[x] = x;
                while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; }
                return x;
              };
              const ufUnion = (a, b) => { parent[ufFind(a)] = ufFind(b); };
              foEdges.forEach(([a, b]) => { ufUnion(a, b); ufFind(a); ufFind(b); });

              const comps = {};
              const allNodes = new Set(foEdges.flat());
              allNodes.forEach((x) => {
                const root = ufFind(x);
                if (!comps[root]) comps[root] = new Set();
                comps[root].add(x);
              });

              // FO-2: Bill Chain with Cash
              Object.values(comps).forEach((members) => {
                if (members.size <= 1) return;
                const memberArr = [...members];
                let hasCash = false;
                let hasCard = false;
                const rooms = new Set();
                const resvs = new Set();
                memberArr.forEach((bill) => {
                  const mths = billMethods[bill] || {};
                  Object.keys(mths).forEach((m) => {
                    if (isCashMethod(m)) hasCash = true;
                    if (isCardMethod(m)) hasCard = true;
                  });
                  (billToRooms[bill] || new Set()).forEach((r) => rooms.add(r));
                  (billToResvs[bill] || new Set()).forEach((r) => resvs.add(r));
                });
                if (!hasCash || rooms.size <= 1 || resvs.size <= 1) return;
                const score = (hasCard && hasCash && rooms.size > 1) ? 95 : 85;
                exc.push({
                  id: genId("FO"),
                  module: "FO_TX",
                  test: "FO Bill Chain",
                  score,
                  desc: `Rantai folio [${memberArr.join(", ")}]: ${rooms.size} kamar, ${resvs.size} reservasi — ada Cash`,
                  ref: memberArr.join("/"),
                });
              });
            }

            // FO-3: Room Consolidation (Card + Cash exact two methods, multiple rooms)
            const revStarPattern = /^\*(\d+)/;
            const destBills = new Set();
            revRows.forEach((r) => {
              if (r.artNo === 99 && revStarPattern.exec(r.descRaw)) destBills.add(r.billNo);
            });
            const seenConsolidation = new Set();
            destBills.forEach((dest) => {
              const rooms = billToRooms[dest] || new Set();
              const resvs = billToResvs[dest] || new Set();
              if (rooms.size <= 1 || resvs.size <= 1) return;
              const mths = billMethods[dest] || {};
              const mthKeys = Object.keys(mths);
              if (mthKeys.length !== 2) return;
              const hasCash2 = mthKeys.some((m) => isCashMethod(m));
              const hasCard2 = mthKeys.some((m) => isCardMethod(m));
              if (!hasCash2 || !hasCard2) return;
              const key = String(dest);
              if (seenConsolidation.has(key)) return;
              seenConsolidation.add(key);
              const methodStr = mthKeys.map((m) => `${m} (${Math.round(mths[m]).toLocaleString()})`).join("; ");
              exc.push({
                id: genId("FO"),
                module: "FO_TX",
                test: "FO Room Konsolidasi",
                score: 95,
                desc: `Bill ${dest}: charge ${rooms.size} kamar digabung, bayar Card+Cash: ${methodStr}`,
                ref: String(dest),
              });
            });

            // FO-4: Room Charge Without Payment
            const rcBills = new Set(rcRows.map((r) => r.billNo));
            const paidBills = new Set(payReal.map((r) => r.billNo));
            rcBills.forEach((bill) => {
              if (paidBills.has(bill)) return;
              const rcBillRows = rcRows.filter((r) => r.billNo === bill);
              const total = rcBillRows.reduce((s, r) => s + r.amount, 0);
              const guest = (rcBillRows[0] || {}).guestName || "";
              const receiver = (rcBillRows[0] || {}).billReceiver || "";
              const isIndividual = !receiver || ["nan", "", "[individual reservation]", "[walk in guest],"].includes(receiver.toLowerCase());
              if (!isIndividual) return; // skip OTA/company (city ledger)
              exc.push({
                id: genId("FO"),
                module: "FO_TX",
                test: "FO Tanpa Pembayaran",
                score: 90,
                desc: `Bill ${bill} (${guest || "?"}): Room charge Rp ${Math.round(total).toLocaleString()} — tidak ada pembayaran`,
                ref: String(bill),
              });
            });
          }
          // ============================================================
          // END FO ANOMALY
          // ============================================================

          setTimeout(() => {
            const deduped = [];
            const seen = new Set();
            exc.forEach((e) => {
              const key = [
                safeStr(e.module).toUpperCase(),
                safeStr(e.test).toUpperCase(),
                safeStr(e.ref).toUpperCase(),
                safeStr(e.desc).toUpperCase(),
              ].join("|");
              if (seen.has(key)) return;
              seen.add(key);
              deduped.push(enrichException(e));
            });
            setExceptions(deduped);
            setIsAnalyzed(true);
            setActiveTab("TEMUAN");
            setIsAnalyzing(false);
          }, 20);
        };

        const stats = useMemo(
          () => ({
            total: exceptions.length,
            critical: exceptions.filter((e) => e.score >= 90).length,
            high: exceptions.filter((e) => e.score >= 70).length,
            byMod: [
              {
                name: "Hotel/Mall/Apt",
                value: exceptions.filter((e) =>
                  ["APARTMENT", "RENTAL", "IPL", "HOTEL", "MALL", "CONST", "FO_RC", "FO_TX"].includes(e.module)

                                        </td>
                                        <td className="p-2">{row.monthLabel}</td>
                                        <td className="p-2 text-right">{row.txCount}</td>
                                        <td className="p-2 text-right">
                                          {row.closingBalance === null ? "-" : row.closingBalance.toLocaleString()}
                                        </td>
                                        <td className="p-2">{row.quality}</td>
                                      </tr>
                                    ))
                                  )}
                                </tbody>
                              </table>
                            </div>
                          </Card>
                        </div>

                        <Card className="bg-slate-800/40">
                          <h4 className="text-xs font-black uppercase tracking-widest text-slate-400 mb-4">
                            Detail Temuan Audit
                          </h4>
                          <div className="overflow-auto max-h-[520px]">
                            <table className="w-full text-left text-[11px] text-slate-400 border-collapse">
                              <thead className="text-slate-500 uppercase font-black tracking-tighter sticky top-0 bg-slate-900/60">
                                <tr>
                                  <th className="p-2 border-b border-slate-700">Risk</th>
                                  <th className="p-2 border-b border-slate-700">Mod</th>
                                  <th className="p-2 border-b border-slate-700">Temuan</th>
                                  <th className="p-2 border-b border-slate-700">Evidence</th>
                                  <th className="p-2 border-b border-slate-700">Kondisi</th>
                                  <th className="p-2 border-b border-slate-700">Kriteria</th>
                                  <th className="p-2 border-b border-slate-700">Ref</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-800">
                                {reportStats.all.length === 0 ? (
                                  <tr>
                                    <td
                                      colSpan="7"
                                      className="p-6 text-center text-slate-600 font-black italic uppercase tracking-widest"
                                    >
                                      Tidak ada exception.
                                    </td>
                                  </tr>
                                ) : (
                                  reportStats.all.map((e, idx) => (
                                    <tr key={`${e.id}-${idx}`}>
                                      <td className="p-2">
                                        {e.riskLabel || getRiskLabel(e.score)} ({e.score})
                                      </td>
                                      <td className="p-2">{e.module}</td>
                                      <td className="p-2">{e.test}</td>
                                      <td className="p-2">
                                        <EvidenceBadge evidence={e.evidence} compact />
                                      </td>
                                      <td className="p-2">{e.desc}</td>
                                      <td className="p-2">{e.criteria || getCriteria(e.test)}</td>
                                      <td className="p-2">{e.ref}</td>
                                    </tr>
                                  ))
                                )}
                              </tbody>
                            </table>
                          </div>
                        </Card>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>

            <footer className="mt-12 text-center text-slate-700 text-[10px] font-black uppercase tracking-[0.2em] border-t border-slate-800/50 pt-8">
              <p>
                &copy; 2026 AuditScope INPP • PT Indonesian Paradise Property Tbk
              </p>
            </footer>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
